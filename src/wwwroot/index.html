<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LeetCode practice</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <select id="problem" aria-label="Problem"></select>
    <button id="run" class="run" title="Ctrl+Enter">▶ Run tests</button>
    <button id="submit" class="primary">Submit</button>
    <select id="debugTest" aria-label="Test to debug"></select>
    <button id="debug" title="Run one test and step through it">Debug</button>
    <button id="reset">Reset code</button>
    <span id="timer">00:00</span>
    <button id="restart">Restart timer</button>
    <label><input type="checkbox" id="suggest" checked> Suggestions</label>
    <span id="saved" role="status"></span>
  </header>
  <div id="due" hidden></div>
  <main>
    <section id="left">
      <div id="description"></div>
      <div id="editor" aria-label="Code editor"></div>
    </section>
    <section id="right">
      <div id="results" aria-live="polite"></div>
      <div class="pair">
        <label>Time complexity<input id="time" placeholder="O(?)"></label>
        <label>Space complexity<input id="space" placeholder="O(?)"></label>
      </div>
      <div id="traceLabel"></div>
      <div class="scroll"><table id="rows"></table></div>
      <div><button id="addRow">Add row</button></div>
      <details id="ownTests">
        <summary>Own tests</summary>
        <p class="note">One input line per parameter. Predict the answer before you run it.</p>
        <div id="customs"></div>
        <button id="addCustom">Add test</button>
      </details>
      <details>
        <summary>Notes (optional)</summary>
        <textarea id="trace" aria-label="Notes"></textarea>
      </details>
    </section>
  </main>
  <script src="vs/loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
